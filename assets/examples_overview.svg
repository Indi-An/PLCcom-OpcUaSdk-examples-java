<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="390" viewBox="0 0 920 390" role="img" aria-labelledby="title desc">
  <title id="title">PLCcom OPC UA SDK for Java workshop repository overview</title>
  <desc id="desc">The repository contains a Maven reactor with the shared PLCcom Console helper, client and server workshops for the PLCcom OPC UA SDK, and PubSub workshops for the PLCcom PubSub add-on.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .bg { fill: #ffffff; }
      .panel { fill: #F7F8FB; stroke: #D6D9E0; stroke-width: 1.2; }
      .module { fill: #EEF3FF; stroke: #001489; stroke-width: 1.5; }
      .soft { fill: #ffffff; stroke: #D6D9E0; stroke-width: 1.1; }
      .title { font: bold 17px Verdana, Arial, sans-serif; fill: #001489; }
      .subtitle { font: 12px Verdana, Arial, sans-serif; fill: #505050; }
      .label { font: bold 13px Verdana, Arial, sans-serif; fill: #202020; }
      .blueLabel { font: bold 13px Verdana, Arial, sans-serif; fill: #001489; }
      .text { font: 12px Verdana, Arial, sans-serif; fill: #202020; }
      .small { font: 11px Verdana, Arial, sans-serif; fill: #505050; }
      .line { stroke: #001489; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .middle { text-anchor: middle; dominant-baseline: middle; }
    ]]></style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#001489"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="390"/>

  <text class="title" x="32" y="34">PLCcom OPC UA SDK for Java - Workshop Repository</text>
  <text class="subtitle" x="32" y="58">One Maven reactor builds the shared console helper, client/server workshops and PubSub add-on workshops.</text>

  <rect class="panel" x="34" y="104" width="194" height="184" rx="5"/>
  <text class="blueLabel" x="58" y="136">Maven Reactor</text>
  <text class="text" x="58" y="164">PLCcom.Console</text>
  <text class="text" x="58" y="188">Client_Server_Samples</text>
  <text class="text" x="58" y="212">PubSub_Samples</text>
  <text class="small" x="58" y="248">Shared console output</text>
  <text class="small" x="58" y="266">for all workshops</text>

  <rect class="module" x="300" y="92" width="286" height="140" rx="6"/>
  <text class="blueLabel" x="324" y="124">Client / Server Workshops</text>
  <rect class="soft" x="324" y="146" width="108" height="46" rx="4"/>
  <text class="text middle" x="378" y="169">Client</text>
  <rect class="soft" x="456" y="146" width="108" height="46" rx="4"/>
  <text class="text middle" x="510" y="169">Server</text>
  <text class="small" x="324" y="211">Discovery, sessions and data access</text>
  <text class="small" x="324" y="226">Alarms, history, events and methods</text>

  <rect class="module" x="300" y="252" width="286" height="116" rx="6"/>
  <text class="blueLabel" x="324" y="284">PubSub Workshops</text>
  <rect class="soft" x="324" y="306" width="108" height="42" rx="4"/>
  <text class="text middle" x="378" y="327">Publisher</text>
  <rect class="soft" x="456" y="306" width="108" height="42" rx="4"/>
  <text class="text middle" x="510" y="327">Subscriber</text>
  <text class="small" x="324" y="361">UDP, MQTT, TLS, UADP and JSON</text>

  <rect class="panel" x="676" y="106" width="210" height="118" rx="5"/>
  <text class="blueLabel" x="700" y="138">PLCcom OPC UA SDK</text>
  <text class="text" x="700" y="166">UaClient and UaServer</text>
  <text class="text" x="700" y="188">OPC UA stack</text>
  <text class="text" x="700" y="210">PKI and security</text>

  <rect class="panel" x="676" y="262" width="210" height="98" rx="5"/>
  <text class="blueLabel" x="700" y="294">PLCcom PubSub Add-on</text>
  <text class="text" x="700" y="322">Uses the SDK stack</text>
  <text class="text" x="700" y="344">and PLCcom MQTT client</text>

  <path class="line" d="M228 170 H294"/>
  <path class="line" d="M228 212 C260 212, 268 312, 294 312"/>
  <path class="line" d="M586 158 H670"/>
  <path class="line" d="M586 312 H670"/>
  <text class="small" x="238" y="156">modules</text>
  <text class="small" x="598" y="144">depends on</text>
  <text class="small" x="598" y="298">depends on</text>
</svg>
